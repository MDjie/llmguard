      - ./drizzle/0044_audit_source_attribution.sql:/docker-entrypoint-initdb.d/53-audit-source-attribution.sql:ro
      - ./drizzle/0045_distributed_rate_limiting.sql:/docker-entrypoint-initdb.d/54-distributed-rate-limiting.sql:ro
      - ./drizzle/0046_tenant_composite_indexes.sql:/docker-entrypoint-initdb.d/55-tenant-composite-indexes.sql:ro
