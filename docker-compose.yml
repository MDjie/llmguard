x-runtime-environment: &runtime-environment
  DATABASE_URL: "postgres://${DB_USER:-guardllm}:${DB_PASSWORD:?DB_PASSWORD is required}@postgres:5432/${DB_NAME:-guardllm}"
  DATABASE_SSL_MODE: "${DATABASE_SSL_MODE:-disable}"
  DATABASE_PLAINTEXT_ALLOWED_HOSTS: "${DATABASE_PLAINTEXT_ALLOWED_HOSTS:-postgres}"
  NODE_ENV: production
  GUARDLLM_DEPLOYMENT_PROFILE: local-compose
  GUARDLLM_ENABLE_EXPERIMENTAL_LABS: "${GUARDLLM_ENABLE_EXPERIMENTAL_LABS:-false}"
  JWT_SECRET: "${JWT_SECRET:?JWT_SECRET is required}"
  SECRET_MASTER_KEY: "${SECRET_MASTER_KEY:?SECRET_MASTER_KEY is required}"
  SECRET_MASTER_KEY_ID: "${SECRET_MASTER_KEY_ID:-local-v1}"
  CONTENT_HASH_KEY: "${CONTENT_HASH_KEY:?CONTENT_HASH_KEY is required}"
  # 独立凭证 pepper（可选）：未设置时回落 CONTENT_HASH_KEY 以保持既有凭证有效
  CREDENTIAL_PEPPER: "${CREDENTIAL_PEPPER:-}"
  DLP_TOKENIZATION_HMAC_KEY: "${DLP_TOKENIZATION_HMAC_KEY:?DLP_TOKENIZATION_HMAC_KEY is required}"
  AUDIT_CHAIN_KEY: "${AUDIT_CHAIN_KEY:?AUDIT_CHAIN_KEY is required}"
  AUDIT_CHAIN_KEY_ID: "${AUDIT_CHAIN_KEY_ID:-audit-hmac-v1}"
  PASSWORD_MAX_AGE_DAYS: "${PASSWORD_MAX_AGE_DAYS:-90}"
  IAM_OIDC_ISSUER: "${IAM_OIDC_ISSUER:-}"
  IAM_OIDC_CLIENT_ID: "${IAM_OIDC_CLIENT_ID:-}"
  IAM_OIDC_CLIENT_SECRET: "${IAM_OIDC_CLIENT_SECRET:-}"
  IAM_OIDC_REDIRECT_URI: "${IAM_OIDC_REDIRECT_URI:-}"
  IAM_OIDC_MFA_ACR: "${IAM_OIDC_MFA_ACR:-}"
  IAM_ENTERPRISE_LOGIN_REQUIRED: "${IAM_ENTERPRISE_LOGIN_REQUIRED:-false}"
  CONTENT_MARKING_KEY: "${CONTENT_MARKING_KEY:?CONTENT_MARKING_KEY is required}"
  CONTENT_MARKING_KEY_ID: "${CONTENT_MARKING_KEY_ID:-content-mark-hmac-v1}"
  CONTENT_MARKING_PROVIDER_CODE: "${CONTENT_MARKING_PROVIDER_CODE:?CONTENT_MARKING_PROVIDER_CODE is required}"
  METRICS_BEARER_TOKEN: "${METRICS_BEARER_TOKEN:?METRICS_BEARER_TOKEN is required}"
  POLICY_SIGNING_PUBLIC_KEY_FILE: /run/secrets/guardllm-policy-signing/public.pem
  POLICY_SIGNING_KEY_ID: "${POLICY_SIGNING_KEY_ID:-local-ed25519-v1}"
  POLICY_LKG_MAX_AGE_MS: "${POLICY_LKG_MAX_AGE_MS:-300000}"
  RAG_PROVENANCE_KEY: "${RAG_PROVENANCE_KEY:-}"
  TOOL_PERMIT_SIGNING_KEY: "${TOOL_PERMIT_SIGNING_KEY:-}"
  MULTIMODAL_ANALYZER_BASE_URL: "http://media-analyzer:8090"
  MULTIMODAL_ANALYZER_ALLOWED_PRIVATE_HOSTS: "media-analyzer"
  MEDIA_ANALYZER_BASE_URL: "http://media-analyzer:8090"
  MEDIA_ANALYZER_ALLOWED_PRIVATE_HOSTS: "media-analyzer"
  MULTIMODAL_FRAME_BATCH_SIZE: "${MULTIMODAL_FRAME_BATCH_SIZE:-4}"
  MULTIMODAL_FRAME_INTERVAL_MS: "${MULTIMODAL_FRAME_INTERVAL_MS:-}"
  MULTIMODAL_MAX_FRAMES: "${MULTIMODAL_MAX_FRAMES:-10000}"
  MULTIMODAL_SUMMARY_FRAMES: "${MULTIMODAL_SUMMARY_FRAMES:-24}"
  MULTIMODAL_MAX_DURATION_MS: "${MULTIMODAL_MAX_DURATION_MS:-3600000}"
  MULTIMODAL_MAX_PIXELS: "${MULTIMODAL_MAX_PIXELS:-100000000}"
  MULTIMODAL_MAX_DECODED_BYTES: "${MULTIMODAL_MAX_DECODED_BYTES:-2147483648}"
  MULTIMODAL_MAX_DECOMPRESSION_RATIO: "${MULTIMODAL_MAX_DECOMPRESSION_RATIO:-100}"
  MULTIMODAL_MIN_CONFIDENCE: "${MULTIMODAL_MIN_CONFIDENCE:-0.35}"
  MULTIMODAL_REVIEW_THRESHOLD: "${MULTIMODAL_REVIEW_THRESHOLD:-0.65}"
  MULTIMODAL_BLOCK_THRESHOLD: "${MULTIMODAL_BLOCK_THRESHOLD:-0.8}"
  MULTIMODAL_CROSS_MODAL_WINDOW_MS: "${MULTIMODAL_CROSS_MODAL_WINDOW_MS:-30000}"
  ANALYZER_SHARED_TOKEN: "${ANALYZER_SHARED_TOKEN:?ANALYZER_SHARED_TOKEN is required}"
  EXPORT_APPROVAL_REQUIRED: "${EXPORT_APPROVAL_REQUIRED:-true}"
  GATEWAY_ARCHIVE_MODE: "${GATEWAY_ARCHIVE_MODE:-DISABLED}"
  GATEWAY_ARCHIVE_POLICIES_JSON: "${GATEWAY_ARCHIVE_POLICIES_JSON:-[]}"
  SECRET_MASTER_KEY_RING_JSON: "${SECRET_MASTER_KEY_RING_JSON:-{}}"
  DELETION_PROOF_HMAC_KEY: "${DELETION_PROOF_HMAC_KEY:-}"
  DELETION_PROOF_HMAC_KEY_ID: "${DELETION_PROOF_HMAC_KEY_ID:-}"
  OBJECT_STORE_ENDPOINT: "${OBJECT_STORE_ENDPOINT:-}"
  OBJECT_STORE_BUCKET: "${OBJECT_STORE_BUCKET:-guard-artifacts}"
  OBJECT_STORE_REGION: "${OBJECT_STORE_REGION:-us-east-1}"
  OBJECT_STORE_ACCESS_KEY_ID: "${OBJECT_STORE_ACCESS_KEY_ID:-}"
  OBJECT_STORE_SECRET_ACCESS_KEY: "${OBJECT_STORE_SECRET_ACCESS_KEY:-}"
  OBJECT_STORE_ALLOWED_HOSTS: "${OBJECT_STORE_ALLOWED_HOSTS:-}"
  OBJECT_STORE_ALLOWED_PRIVATE_HOSTS: "${OBJECT_STORE_ALLOWED_PRIVATE_HOSTS:-}"
  RAW_CONTENT_STORAGE_ENABLED: "${RAW_CONTENT_STORAGE_ENABLED:-false}"
  RAW_CONTENT_RETENTION_DAYS: "${RAW_CONTENT_RETENTION_DAYS:-7}"
  PROVIDER_ALLOWED_HOSTS: "${PROVIDER_ALLOWED_HOSTS:-}"
  PROVIDER_ALLOWED_PRIVATE_HOSTS: "${PROVIDER_ALLOWED_PRIVATE_HOSTS:-}"
  JUDGE_PRIVATE_ENDPOINT_APPROVALS_JSON: "${JUDGE_PRIVATE_ENDPOINT_APPROVALS_JSON:-[]}"
  JUDGE_QUALITY_APPROVALS_JSON: "${JUDGE_QUALITY_APPROVALS_JSON:-[]}"
  SEMANTIC_CLASSIFIER_QUALITY_APPROVALS_JSON: "${SEMANTIC_CLASSIFIER_QUALITY_APPROVALS_JSON:-[]}"
  NATIVE_MEDIA_ROUTE_ADAPTERS_JSON: "${NATIVE_MEDIA_ROUTE_ADAPTERS_JSON:-[]}"
  NATIVE_MULTIMODAL_ANALYSIS_ENABLED: "${NATIVE_MULTIMODAL_ANALYSIS_ENABLED:-false}"
  NATIVE_MULTIMODAL_QUALIFICATIONS_JSON: "${NATIVE_MULTIMODAL_QUALIFICATIONS_JSON:-[]}"
  MULTIMODAL_QUALITY_APPROVALS_JSON: "${MULTIMODAL_QUALITY_APPROVALS_JSON:-[]}"
  CALLBACK_ALLOWED_HOSTS: "${CALLBACK_ALLOWED_HOSTS:-}"
  CALLBACK_ALLOWED_PRIVATE_HOSTS: "${CALLBACK_ALLOWED_PRIVATE_HOSTS:-}"
  TOOL_ALLOWED_HOSTS: "${TOOL_ALLOWED_HOSTS:-}"
  TOOL_ALLOWED_PRIVATE_HOSTS: "${TOOL_ALLOWED_PRIVATE_HOSTS:-}"

x-worker-service: &worker-service
  image: guardllm-r0-worker:latest
  build:
    context: .
    dockerfile: Dockerfile
    target: worker
  restart: unless-stopped
  init: true
  depends_on:
    postgres:
      condition: service_healthy
    media-analyzer:
      condition: service_started
  environment: *runtime-environment
  volumes:
    - ./.guardllm/policy-signing/public:/run/secrets/guardllm-policy-signing:ro
  networks: [guardllm-network]
  read_only: true
  tmpfs:
    - /tmp:size=256m,mode=1777
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  stop_grace_period: 30s

services:
  postgres:
    image: postgres:16.10-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-guardllm}
      POSTGRES_PASSWORD: "${DB_PASSWORD:?DB_PASSWORD is required}"
      POSTGRES_DB: ${DB_NAME:-guardllm}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-database-new.sql:/docker-entrypoint-initdb.d/00-schema.sql:ro
      - ./scripts/init-database-supplement.sql:/docker-entrypoint-initdb.d/01-supplement.sql:ro
      - ./drizzle/0001_auth_hardening.sql:/docker-entrypoint-initdb.d/10-auth.sql:ro
      - ./drizzle/0002_provider_secrets.sql:/docker-entrypoint-initdb.d/11-provider-secrets.sql:ro
