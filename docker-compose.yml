    ports:
      - "127.0.0.1:${DB_PORT:-5434}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-guardllm} -d ${DB_NAME:-guardllm}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks: [guardllm-network]
    security_opt: [no-new-privileges:true]

  media-analyzer:
    image: guardllm-r0-media-analyzer:latest
    build:
      context: .
      dockerfile: services/media-analyzer/Dockerfile
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      ANALYZER_SHARED_TOKEN: "${ANALYZER_SHARED_TOKEN:?ANALYZER_SHARED_TOKEN is required}"
      ANALYZER_OBJECT_STORE_HOSTS: "${ANALYZER_OBJECT_STORE_HOSTS:-}"
      ANALYZER_MAX_IN_FLIGHT: "${ANALYZER_MAX_IN_FLIGHT:-4}"
      ANALYZER_CODE_READER_COMMAND: "${ANALYZER_CODE_READER_COMMAND:-zbarimg}"
      ANALYZER_NATIVE_JOINT_COMMAND: "${ANALYZER_NATIVE_JOINT_COMMAND:-}"
      ANALYZER_VISUAL_COMMAND: "${ANALYZER_VISUAL_COMMAND:-}"
      ANALYZER_ASR_COMMAND: "${ANALYZER_ASR_COMMAND:-}"
      ANALYZER_AUDIO_CLASSIFIER_COMMAND: "${ANALYZER_AUDIO_CLASSIFIER_COMMAND:-}"
      ANALYZER_TTS_COMMAND: "${ANALYZER_TTS_COMMAND:-}"
    cpus: "${ANALYZER_CPU_LIMIT:-4.0}"
    mem_limit: "${ANALYZER_MEMORY_LIMIT:-8g}"
    pids_limit: 256
    ulimits:
      nofile:
        soft: 1024
        hard: 2048
    networks: [guardllm-network]
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8090/health/live').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  app:
    image: guardllm-r0-app:latest
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    restart: unless-stopped
    init: true
    depends_on:
      postgres:
        condition: service_healthy
      media-analyzer:
        condition: service_started
    environment:
      <<: *runtime-environment
      PORT: 5000
      SESSION_COOKIE_SECURE: "${SESSION_COOKIE_SECURE:-false}"
    volumes:
      - ./.guardllm/policy-signing/public:/run/secrets/guardllm-policy-signing:ro
    ports:
      - "${APP_BIND_HOST:-127.0.0.1}:${APP_PORT:-58082}:5000"
    networks: [guardllm-network]
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
      - /app/.next/cache:size=256m,uid=1000,gid=1000,mode=0750
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:5000/api/health/policy').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    stop_grace_period: 30s

  gateway-request-worker:
    <<: *worker-service
    command: ["node", "--import", "tsx", "scripts/run-worker.mjs", "gateway-request"]

  archive-worker:
    <<: *worker-service
    command: ["node", "--import", "tsx", "scripts/run-worker.mjs", "archive"]

  evaluation-worker:
    <<: *worker-service
    command: ["node", "--import", "tsx", "scripts/run-worker.mjs", "evaluation"]

  security-scan-worker:
    <<: *worker-service
    command: ["node", "--import", "tsx", "scripts/run-worker.mjs", "security-scan"]

  artifact-worker:
    <<: *worker-service
    command: ["node", "--import", "tsx", "scripts/run-worker.mjs", "artifact"]

  native-multimodal-worker:
    <<: *worker-service
    command: ["node", "--import", "tsx", "scripts/run-worker.mjs", "native-multimodal"]

  multimodal-worker:
    <<: *worker-service
    command: ["node", "--import", "tsx", "scripts/run-worker.mjs", "multimodal"]

  media-worker:
    <<: *worker-service
    command: ["node", "--import", "tsx", "scripts/run-worker.mjs", "media"]

  content-marking-worker:
    <<: *worker-service
    command: ["node", "--import", "tsx", "scripts/run-worker.mjs", "content-marking"]

  rag-worker:
    <<: *worker-service
    command: ["node", "--import", "tsx", "scripts/run-worker.mjs", "rag"]

  callback-worker:
    <<: *worker-service
    command: ["node", "--import", "tsx", "scripts/run-worker.mjs", "callback"]

  audit-export-worker:
    <<: *worker-service
    command: ["node", "--import", "tsx", "scripts/run-worker.mjs", "audit-export"]

  audit-timestamp-worker:
    <<: *worker-service
    command: ["node", "--import", "tsx", "scripts/run-worker.mjs", "audit-timestamp"]

  audit-chain-worker:
    <<: *worker-service
    command: ["node", "--import", "tsx", "scripts/run-worker.mjs", "audit-chain"]

  iam-worker:
    <<: *worker-service
    command: ["node", "--import", "tsx", "scripts/run-worker.mjs", "iam"]


volumes:
  postgres_data:

networks:
  guardllm-network:
    driver: bridge
