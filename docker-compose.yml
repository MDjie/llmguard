      - ./drizzle/0057_gateway_request_resources.sql:/docker-entrypoint-initdb.d/67-gateway-request-resources.sql:ro
      - ./drizzle/0058_gateway_shadow_evaluations.sql:/docker-entrypoint-initdb.d/68-gateway-shadow-evaluations.sql:ro
      - ./drizzle/0059_security_alert_projection.sql:/docker-entrypoint-initdb.d/69-security-alert-projection.sql:ro
      - ./drizzle/0060_conversation_archive.sql:/docker-entrypoint-initdb.d/70-conversation-archive.sql:ro
      - ./drizzle/0061_badcase_independent_review.sql:/docker-entrypoint-initdb.d/71-badcase-independent-review.sql:ro
      - ./drizzle/0062_alert_projection_recovery.sql:/docker-entrypoint-initdb.d/72-alert-projection-recovery.sql:ro
      - ./drizzle/0063_media_evidence_snapshots.sql:/docker-entrypoint-initdb.d/73-media-evidence-snapshots.sql:ro
      - ./drizzle/0064_feedback_candidate_exports.sql:/docker-entrypoint-initdb.d/74-feedback-candidate-exports.sql:ro
      - ./drizzle/0065_runtime_trace_schema.sql:/docker-entrypoint-initdb.d/75-runtime-trace-schema.sql:ro
      - ./drizzle/0066_whitelist_proposal_identity.sql:/docker-entrypoint-initdb.d/76-whitelist-proposal-identity.sql:ro
      - ./drizzle/0067_export_query_summary.sql:/docker-entrypoint-initdb.d/77-export-query-summary.sql:ro
      - ./drizzle/0068_runtime_worker_health.sql:/docker-entrypoint-initdb.d/78-runtime-worker-health.sql:ro
      - ./drizzle/0069_layered_media_evidence.sql:/docker-entrypoint-initdb.d/79-layered-media-evidence.sql:ro
      - ./drizzle/0070_policy_bundle_lifecycle_states.sql:/docker-entrypoint-initdb.d/80-policy-bundle-lifecycle-states.sql:ro
      - ./drizzle/0071_artifact_purge_ledger.sql:/docker-entrypoint-initdb.d/81-artifact-purge-ledger.sql:ro
      - ./drizzle/0072_original_media_access.sql:/docker-entrypoint-initdb.d/82-original-media-access.sql:ro
      - ./drizzle/0073_iam_application_grants.sql:/docker-entrypoint-initdb.d/83-iam-application-grants.sql:ro
