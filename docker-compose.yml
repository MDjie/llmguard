      - ./drizzle/0026_audit_trusted_timestamp.sql:/docker-entrypoint-initdb.d/35-audit-trusted-timestamp.sql:ro
      - ./drizzle/0027_data_lineage_deletion_proofs.sql:/docker-entrypoint-initdb.d/36-data-lineage-deletion-proofs.sql:ro
      - ./drizzle/0028_secure_memory_layers.sql:/docker-entrypoint-initdb.d/37-secure-memory-layers.sql:ro
      - ./drizzle/0029_action_firewall.sql:/docker-entrypoint-initdb.d/38-action-firewall.sql:ro
      - ./drizzle/0030_guard_resource_control.sql:/docker-entrypoint-initdb.d/39-guard-resource-control.sql:ro
      - ./drizzle/0031_immutable_evaluation_attempts.sql:/docker-entrypoint-initdb.d/40-immutable-evaluation-attempts.sql:ro
      - ./drizzle/0032_tool_supply_chain_admission.sql:/docker-entrypoint-initdb.d/41-tool-supply-chain-admission.sql:ro
      - ./drizzle/0033_operational_security_domains.sql:/docker-entrypoint-initdb.d/42-operational-security-domains.sql:ro
      - ./drizzle/0034_security_scanning.sql:/docker-entrypoint-initdb.d/43-security-scanning.sql:ro
