# Source: guardllm/templates/workloads.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: guardllm-guardllm-analyzer-config
  namespace: guard-media
data:
  ANALYZER_ASR_COMMAND: "/models/bin/asr"
  ANALYZER_AUDIO_CLASSIFIER_COMMAND: "/models/bin/audio-classifier"
  ANALYZER_CODE_READER_COMMAND: "/usr/bin/zbarimg"
  ANALYZER_OBJECT_STORE_HOSTS: "minio.guard-data-access.svc.cluster.local"
  ANALYZER_TTS_COMMAND: "/models/bin/tts"
  ANALYZER_VISUAL_COMMAND: "/models/bin/visual-classifier"
  GATEWAY_MTLS_REQUIRED: "false"
  GUARDLLM_DEPLOYMENT_PROFILE: "production"
  GUARDLLM_SITE_ID: "center-a"
  GUARD_API_MAX_IN_FLIGHT: "200"
  GUARD_APPLICATION_MAX_IN_FLIGHT: "100"
  GUARD_CONCURRENCY_ENABLED: "true"
  GUARD_CONCURRENCY_MAX_TRACKED_SCOPES: "10000"
  GUARD_CREDENTIAL_MAX_IN_FLIGHT: "50"
  GUARD_DISTRIBUTED_CONCURRENCY_ENABLED: "true"
  GUARD_DISTRIBUTED_CONCURRENCY_FAIL_CLOSED: "true"
  GUARD_DISTRIBUTED_CONCURRENCY_LEASE_TTL: "30s"
  GUARD_GATEWAY_MODE: "enforce"
  GUARD_MODEL_ROUTES_JSON: ""
  GUARD_PRINCIPAL_MAX_IN_FLIGHT: "20"
  GUARD_RATE_LIMIT_ENABLED: "true"
  GUARD_RATE_LIMIT_ESTIMATED_TOKENS_PER_MINUTE: "2500000"
  GUARD_RATE_LIMIT_FAIL_CLOSED: "true"
  GUARD_RATE_LIMIT_MAX_TEXT_CHARS_PER_REQUEST: "1000000"
  GUARD_RATE_LIMIT_REQUESTS_PER_MINUTE: "600"
  GUARD_RATE_LIMIT_TEXT_CHARS_PER_MINUTE: "10000000"
  GUARD_REDIS_URI: "rediss://redis.guard-data-access.svc.cluster.local:6380"
  GUARD_TENANT_MAX_IN_FLIGHT: "200"
  LOG_LEVEL: "info"
  MULTIMODAL_BLOCK_THRESHOLD: "0.8"
  MULTIMODAL_CROSS_MODAL_WINDOW_MS: "30000"
  MULTIMODAL_FRAME_BATCH_SIZE: "4"
  MULTIMODAL_FRAME_INTERVAL_MS: ""
  MULTIMODAL_MAX_DECODED_BYTES: "2147483648"
  MULTIMODAL_MAX_DECOMPRESSION_RATIO: "100"
  MULTIMODAL_MAX_DURATION_MS: "3600000"
  MULTIMODAL_MAX_FRAMES: "10000"
  MULTIMODAL_MAX_PIXELS: "100000000"
  MULTIMODAL_MIN_CONFIDENCE: "0.35"
  MULTIMODAL_REVIEW_THRESHOLD: "0.65"
  MULTIMODAL_SUMMARY_FRAMES: "24"
  NODE_ENV: "production"
  OPERATIONS_MONITOR_ALLOWED_HOSTS: "prometheus.guard-observability.svc.cluster.local"
  OPERATIONS_PROMETHEUS_URL: "http://prometheus.guard-observability.svc.cluster.local:9090/"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector.guard-observability.svc:4318"
  POLICY_LKG_MAX_AGE_MS: "300000"
