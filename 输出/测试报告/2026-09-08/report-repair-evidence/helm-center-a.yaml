# Source: guardllm/templates/availability.yaml
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: guardllm-guardllm-app
  namespace: guard-online
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: guardllm-guardllm-app
  minReplicas: 3
  maxReplicas: 20
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
    scaleUp:
      stabilizationWindowSeconds: 30
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
