apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: guardllm-require-hardened-pods
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: enforce-runtime-controls
      match:
        any:
          - resources:
              kinds: [Pod]
              namespaceSelector:
                matchLabels: { guardllm.io/managed: "true" }
      validate:
        allowExistingViolations: false
        message: GuardLLM pods must run non-root with RuntimeDefault seccomp and hardened containers.
        pattern:
          spec:
            securityContext:
              runAsNonRoot: true
              seccompProfile: { type: RuntimeDefault }
            containers:
              - securityContext:
                  allowPrivilegeEscalation: false
                  readOnlyRootFilesystem: true
                  capabilities:
                    drop: ["ALL"]
