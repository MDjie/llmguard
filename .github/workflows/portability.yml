name: Multi-architecture portability

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  oci-images:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: app
            context: .
            file: Dockerfile
            target: runner
          - name: worker
            context: .
            file: Dockerfile
            target: worker
          - name: gateway
            context: services/guard-gateway
            file: services/guard-gateway/Dockerfile
            target: ""
          - name: analyzer
            context: .
            file: services/media-analyzer/Dockerfile
            target: ""
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build linux/amd64 and linux/arm64
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: false
          outputs: type=cacheonly
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
